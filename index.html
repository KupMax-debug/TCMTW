<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Stoppuhr TCM</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0A7C91">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Stoppuhr TCM">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>
/* Layout: Poolside-Stoppuhr. Kopf mit Leinen-Streifen, drei Tabs, Strecke und Sportlerauswahl oben, darunter eine Stoppuhr pro Sportler, feste Steuerleiste unten fuer nasse Daumen. */
:root{
  --bg:#EAF1F1; --surface:#F8FBFB; --surface-2:#DCE8E8; --ink:#0C2730; --muted:#4C6770; --line:#C5D6D6;
  --accent:#0A7C91; --accent-ink:#FFFFFF; --stop:#D9441E; --stop-ink:#FFFFFF; --ok:#1E8A5A; --rope-w:#F8FBFB;
  --display:'Barlow Condensed','Arial Narrow',system-ui,sans-serif; --body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#081A20; --surface:#102830; --surface-2:#17353F; --ink:#E3F0F1; --muted:#8DAAB2; --line:#24444E;
    --accent:#3FC1D9; --accent-ink:#06222A; --stop:#FF7A57; --stop-ink:#2A0C03; --ok:#52C98C; --rope-w:#D8E8EA; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#081A20; --surface:#102830; --surface-2:#17353F; --ink:#E3F0F1; --muted:#8DAAB2; --line:#24444E;
  --accent:#3FC1D9; --accent-ink:#06222A; --stop:#FF7A57; --stop-ink:#2A0C03; --ok:#52C98C; --rope-w:#D8E8EA; color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
body{background:var(--bg);color:var(--ink);font:400 16px/1.4 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:12px 170px}
#logoBg{position:fixed;inset:0;z-index:0;pointer-events:none;background:center / min(82vw,540px) no-repeat;opacity:.09}
.app{position:relative;z-index:1;max-width:640px;margin:0 auto}
.brand{display:flex;align-items:center;gap:14px}
.brand h1{margin-bottom:0}
.mark{height:60px;width:auto;flex:none}
.brand+.rope{margin-top:10px}
.club{margin:0;font:600 12px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
h1{margin:6px 0 10px;font:700 46px/1 var(--display);letter-spacing:.01em;text-wrap:balance}
h2{margin:0;font:700 22px/1.1 var(--display);letter-spacing:.02em;text-transform:uppercase}
.rope{height:8px;border-radius:4px;background:repeating-linear-gradient(90deg,var(--stop) 0 18px,var(--rope-w) 18px 36px,var(--accent) 36px 54px,var(--rope-w) 54px 72px)}
.tabs{display:flex;gap:4px;margin:14px 0 16px;border-bottom:1px solid var(--line)}
.tabs button{flex:1;min-height:48px;border:0;border-bottom:3px solid transparent;background:transparent;color:var(--muted);font:600 17px var(--body);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.stack{display:grid;gap:18px}
.block{display:grid;gap:10px}
.bh{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.muted{color:var(--muted)}
.lbl{display:block;margin-bottom:6px;font:600 12px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.setup{display:grid;gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.seg{display:flex;gap:3px;background:var(--surface-2);border-radius:10px;padding:3px}
.seg button{flex:1;min-width:0;min-height:46px;border:0;border-radius:8px;background:transparent;color:var(--ink);font:600 16px var(--body);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:46px;padding:0 16px;border:1px solid var(--line);border-radius:999px;background:var(--bg);color:var(--ink);font:600 16px var(--body);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip:disabled{opacity:.55;cursor:default}
.sumline{margin:0;font:600 17px/1.3 var(--body)}
input[type=text],input[type=date],input[type=number],textarea{width:100%;min-height:48px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:400 16px var(--body)}
textarea{padding:10px 12px;resize:vertical;line-height:1.4}
.list{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.empty{margin:0;padding:18px 16px;color:var(--muted)}
.ath{padding:12px 14px;border-top:1px solid var(--line);display:grid;gap:10px}
.ath:first-child{border-top:0}
.name{width:100%;min-width:0;min-height:44px;padding:0 2px;border:0;border-bottom:1px dashed var(--muted);border-radius:0;background:transparent;color:var(--ink);font:600 20px var(--body)}
.nm2{font:600 21px/1.2 var(--body);overflow-wrap:anywhere}
.icon{min-width:46px;height:46px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:500 26px/1 var(--body);cursor:pointer}
.icon.armed{padding:0 10px;font:600 14px var(--body);border-color:var(--stop);color:var(--stop)}
.top{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center}
.who{display:grid;gap:2px;min-width:0}
.prog{font-size:14px;color:var(--muted)}
.t{font:700 40px/1 var(--display);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.t.off{color:var(--muted)}
.done .t{color:var(--ok)}
.r-run{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.r-run .lap{grid-column:1/-1}
.r-idle{display:grid;grid-template-columns:1fr}
.r-done{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(110px,1fr))}
.btn{min-height:52px;padding:0 18px;border:1px solid transparent;border-radius:10px;font:600 18px var(--body);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.stop{background:var(--stop);color:var(--stop-ink)}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn.armed{border-color:var(--stop);color:var(--stop)}
.btn.lap{min-height:68px;font-size:24px;font-family:var(--display);letter-spacing:.04em;text-transform:uppercase}
.btn.small{min-height:58px;padding:0 10px;font-size:16px}
.btn.mark{border-color:var(--accent);color:var(--accent)}
.marks{display:grid;gap:4px}
.marks .lbl{margin:0}
.btn.mid{min-height:46px;font-size:16px}
.btn:disabled,.icon:disabled{opacity:.4;cursor:default}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
details.splits summary{cursor:pointer;color:var(--muted);font-size:14px;min-height:28px}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:15px;margin-top:4px}
.tbl th,.tbl td{padding:3px 14px 3px 0;text-align:left;white-space:nowrap}
.tbl th{font-weight:600;color:var(--muted);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
#bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#bar .in{max-width:640px;margin:0 auto;display:grid;gap:8px}
.barstat{font:700 26px/1.1 var(--display);letter-spacing:.02em}
.btns{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}
.btns .wide{grid-column:1/-1}
.cards{display:grid;gap:14px}
.sess{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:10px}
.sh{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.date{font:700 20px/1.1 var(--display);letter-spacing:.02em}
.badge{padding:3px 10px;border-radius:999px;font:600 13px var(--body);background:var(--surface-2);color:var(--ink)}
.badge.wk{background:var(--accent);color:var(--accent-ink)}
.stitle{font-weight:600}
.res{display:grid;grid-template-columns:28px minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.rk{font:700 20px var(--display);color:var(--muted)}
.res:first-child .rk{color:var(--accent)}
.nm{font-weight:500;overflow-wrap:anywhere}
.tm{font:700 24px var(--display);font-variant-numeric:tabular-nums}
.res .icon{min-width:40px;height:40px;font-size:22px}
.res .more{grid-column:2/-1}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.acts .btn{min-height:46px;font-size:16px;flex:1}
.logoprev{width:120px;height:120px;border:1px dashed var(--line);border-radius:12px;background:center / contain no-repeat var(--surface-2);display:grid;place-items:center;color:var(--muted);font-size:13px;text-align:center;padding:6px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:12px}
.panel p{margin:0}
.poolrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center}
.addrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:end}
#sheet{position:fixed;inset:0;z-index:40}
.scrim{position:absolute;inset:0;background:rgba(4,16,20,.55)}
.sp{position:absolute;left:0;right:0;bottom:0;max-height:88%;overflow:auto;background:var(--surface);color:var(--ink);border-top:1px solid var(--line);border-radius:16px 16px 0 0;
  padding-top:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sp>*{max-width:640px;margin-left:auto;margin-right:auto}
.sp .sbody{display:grid;gap:14px;margin-top:12px}
.sh-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.chk{display:flex;align-items:center;gap:10px;min-height:44px;font-weight:500}
.chk input{width:22px;height:22px;accent-color:var(--accent)}
.prev{display:grid;gap:2px;font-size:15px;margin:0;padding:10px 12px;background:var(--surface-2);border-radius:8px}
#toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 12px);z-index:60;max-width:calc(100% - 32px);padding:10px 16px;border-radius:10px;background:var(--ink);color:var(--bg);font-weight:600;text-align:center}
@media (prefers-reduced-motion: no-preference){ .btn,.chip,.seg button{transition:background-color .12s,color .12s} }
</style>
</head>
<body>

<div class="app">
  <header>
    <div class="brand">
      <img id="markLogo" class="mark" alt="Logo Tauchsportclub Marzahn" width="44" height="60">
      <div><p class="club">Tauchsportclub Marzahn</p>
      <h1>Stoppuhr</h1></div>
    </div>
    <div class="rope" aria-hidden="true"></div>
    <nav class="tabs" role="tablist" aria-label="Bereiche">
      <button type="button" role="tab" data-tab="stop" aria-selected="true">Stoppen</button>
      <button type="button" role="tab" data-tab="res" aria-selected="false">Ergebnisse</button>
      <button type="button" role="tab" data-tab="set" aria-selected="false">Einstellungen</button>
    </nav>
  </header>
  <main id="view"></main>
</div>
<div id="logoBg" aria-hidden="true"></div>
<div id="bar" hidden></div>
<div id="sheet" hidden>
  <div class="scrim" id="scrim"></div>
  <div class="sp" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" id="sp"></div>
</div>
<div id="toast" role="status" aria-live="polite" hidden></div>

<script>
(function(){
'use strict';
var $=function(s,r){return (r||document).querySelector(s);};
function h(tag,a){
  var e=document.createElement(tag); a=a||{};
  Object.keys(a).forEach(function(k){
    var v=a[k];
    if(v===false||v==null) return;
    if(k==='class') e.className=v;
    else if(k==='text') e.textContent=v;
    else if(k.slice(0,2)==='on') e.addEventListener(k.slice(2),v);
    else if(v===true) e.setAttribute(k,'');
    else e.setAttribute(k,v);
  });
  for(var i=2;i<arguments.length;i++){
    [].concat(arguments[i]).forEach(function(x){
      if(x==null||x===false) return;
      e.append(x.nodeType?x:document.createTextNode(x));
    });
  }
  return e;
}
function lsGet(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function lsDel(k){try{localStorage.removeItem(k);}catch(e){}}
var pad=function(n){return String(n).padStart(2,'0');};
function parts(ms){var cs=Math.max(0,Math.floor(ms/10));return {m:Math.floor(cs/6000),s:Math.floor((cs%6000)/100),c:cs%100};}
function fmt(ms){var p=parts(ms);return p.m+':'+pad(p.s)+','+pad(p.c);}
function fmtLap(ms){var p=parts(ms);return p.m?p.m+':'+pad(p.s)+','+pad(p.c):p.s+','+pad(p.c);}
function todayISO(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function dateLong(iso){var a=(iso||'').split('-').map(Number);if(!a[0])return '';return new Date(a[0],a[1]-1,a[2]).toLocaleDateString('de-DE',{weekday:'short',day:'numeric',month:'long',year:'numeric'});}
function dateShort(iso){var a=(iso||'').split('-');return a.length===3?a[2]+'.'+a[1]+'.'+a[0]:'';}
function pid(){return 'p'+Math.random().toString(36).slice(2,8);}
function rid(){return 'r_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}

var DISC={
  fin:[
    {k:'SF',label:'Surface',d:[50,100,200,400,800,1500]},
    {k:'AP',label:'Apnoe',d:[25,50]},
    {k:'IM',label:'Immersion',d:[100,200,400]},
    {k:'ST',label:'Streckentauchen',d:[25,50,75,100]}
  ],
  swim:[
    {k:'FR',label:'Freistil',d:[50,100,200,400,800,1500]},
    {k:'BR',label:'Brust',d:[50,100,200]},
    {k:'RU',label:'Rücken',d:[50,100,200]},
    {k:'SM',label:'Schmetterling',d:[50,100,200]},
    {k:'LA',label:'Lagen',d:[100,200,400]}
  ]
};

function convertSession(s){
  return (s.athletes||[]).map(function(a,i){
    return {kind:'result',id:'r_'+String(s.id).slice(2)+'_'+i,date:s.date,type:s.type,title:s.title||'',note:s.note||'',
      pool:s.pool,family:s.family,disc:s.disc,discLabel:s.discLabel,distance:s.distance,laps:s.laps,athleteId:null,
      name:a.name,time:a.time,splits:a.splits||[],createdAt:s.createdAt||Date.now()};
  });
}

var S={
  tab:'stop',
  cfg:Object.assign({pool:25,family:'fin',disc:'SF',dist:100,custom:false,customVal:''},lsGet('bz.cfg',{})),
  pool:lsGet('bz.pool',null),
  sel:lsGet('bz.sel',[]),
  runs:{},
  results:lsGet('bz.results',[]),
  meta:{date:todayISO(),type:lsGet('bz.type','tr'),title:'',note:''},
  filter:'all',logo:lsGet('bz.logo',null),storage:'local',open:{},dl:null
};
if(!Array.isArray(S.pool)){
  var oldR=lsGet('bz.roster',null);
  S.pool=Array.isArray(oldR)?oldR.map(function(n){return {id:pid(),name:String(n)};}):[];
  if(S.pool.length) lsSet('bz.pool',S.pool);
}
if(!Array.isArray(S.sel)) S.sel=[];
S.sel=S.sel.filter(function(id){return S.pool.some(function(p){return p.id===id;});});
(function(){
  var leg=lsGet('bz.sessions',null);
  if(Array.isArray(leg)&&leg.length){
    leg.forEach(function(s){convertSession(s).forEach(function(r){S.results.push(r);});});
    lsSet('bz.results',S.results);
  }
  if(leg!==null) lsDel('bz.sessions');
})();
if(!DISC[S.cfg.family]) S.cfg.family='fin';
if(!DISC[S.cfg.family].some(function(x){return x.k===S.cfg.disc;})){S.cfg.disc=DISC[S.cfg.family][0].k;S.cfg.dist=DISC[S.cfg.family][0].d[0];S.cfg.custom=false;}
if(S.cfg.pool!==25&&S.cfg.pool!==50) S.cfg.pool=25;

function discObj(){return DISC[S.cfg.family].filter(function(x){return x.k===S.cfg.disc;})[0];}
function discLabel(){return discObj().label;}
function effDist(){return S.cfg.custom?(Number(S.cfg.customVal)||0):S.cfg.dist;}
function totalLaps(){return Math.max(1,Math.ceil(effDist()/S.cfg.pool));}
function summaryText(){var n=totalLaps();return discLabel()+' · '+effDist()+' m · '+S.cfg.pool+'-m-Bahn · '+n+(n===1?' Bahn':' Bahnen');}
function persistCfg(){lsSet('bz.cfg',S.cfg);}
function persistSel(){lsSet('bz.sel',S.sel);}
var poolT=null;
function persistPool(){
  clearTimeout(poolT);
  poolT=setTimeout(function(){lsSet('bz.pool',S.pool);cset('pool',{athletes:S.pool.map(function(p){return {id:p.id,name:p.name};})});},500);
}
function poolName(id){var p=S.pool.filter(function(x){return x.id===id;})[0];return p&&p.name.trim()?p.name.trim():'Sportler';}
function selIds(){return S.pool.filter(function(p){return S.sel.indexOf(p.id)>-1;}).map(function(p){return p.id;});}

/* ---------- Cloud ---------- */
var cloud={col:null};
function cset(id,obj){if(!cloud.col)return;cloud.col.doc(id).set(obj).catch(function(){toast('Cloud-Speichern fehlgeschlagen. Lokal gesichert.');});}
function cdel(id){if(!cloud.col)return;cloud.col.doc(id).delete().catch(function(){});}
async function initCloud(){
  try{
    var c=window.claude; if(!c||!c.use) return;
    c.use('downloads').then(function(d){S.dl=d;}).catch(function(){});
    var user=await c.use('user'); var id=user?await user.id():null; if(!id) return;
    var db=await c.use('db'); if(!db) return;
    cloud.col=db.collection('data/users/'+id);
    var first=true;
    cloud.col.onSnapshot(function(snap){
      if(snap.metadata.fromCache) return;
      var cr=[],leg=[],poolDoc=null,rosterDoc=null,logo=null;
      snap.docs.forEach(function(d){
        var x=d.data(); if(!x) return;
        if(d.id.indexOf('r_')===0&&x.kind==='result') cr.push(x);
        else if(d.id.indexOf('s_')===0&&Array.isArray(x.athletes)) leg.push(x);
        else if(d.id==='pool') poolDoc=x;
        else if(d.id==='roster') rosterDoc=x;
        else if(d.id==='logo') logo=x;
      });
      S.storage='cloud';
      if(first){
        first=false;
        var have={}; cr.forEach(function(r){have[r.id]=1;});
        leg.forEach(function(s){convertSession(s).forEach(function(r){if(!have[r.id]){have[r.id]=1;cr.push(r);cset(r.id,r);}});cdel(s.id);});
        S.results.forEach(function(r){if(!have[r.id]){have[r.id]=1;cr.push(r);cset(r.id,r);}});
        var cl=(poolDoc&&Array.isArray(poolDoc.athletes))?poolDoc.athletes.map(function(a){return {id:String(a.id),name:String(a.name)};}):[];
        var fromLegacy=false;
        if(!cl.length&&rosterDoc&&Array.isArray(rosterDoc.names)){cl=rosterDoc.names.map(function(n){return {id:pid(),name:String(n)};});fromLegacy=true;}
        var ids={}; cl.forEach(function(a){ids[a.id]=1;});
        var added=false; S.pool.forEach(function(a){if(!ids[a.id]){cl.push(a);added=true;}});
        S.pool=cl;
        if(cl.length&&(added||fromLegacy||!poolDoc)) cset('pool',{athletes:cl.map(function(p){return {id:p.id,name:p.name};})});
        lsSet('bz.pool',S.pool);
        S.sel=S.sel.filter(function(i){return S.pool.some(function(p){return p.id===i;});});
        if(logo&&logo.src){S.logo=logo.src;lsSet('bz.logo',S.logo);} else if(S.logo){cset('logo',{src:S.logo});}
      }
      S.results=cr; lsSet('bz.results',S.results);
      applyLogo();
      if(S.tab!=='stop'||!anyRunning()) render();
    },function(){S.storage='local';if(S.tab==='set')render();});
  }catch(e){}

function curLogo(){return S.logo||DEF_LOGO;}
function applyLogo(){$('#logoBg').style.backgroundImage='url("'+curLogo()+'")';var m=$('#markLogo');if(m)m.src=curLogo();}
function shrink(file){
  return new Promise(function(res,rej){
    var fr=new FileReader(); fr.onerror=rej;
    fr.onload=function(){
      var img=new Image(); img.onerror=rej;
      img.onload=function(){
        var max=480;
        function enc(){
          var w0=img.naturalWidth||512,h0=img.naturalHeight||512;
          var sc=Math.min(1,max/Math.max(w0,h0));
          var c=document.createElement('canvas'); c.width=Math.max(1,Math.round(w0*sc)); c.height=Math.max(1,Math.round(h0*sc));
          c.getContext('2d').drawImage(img,0,0,c.width,c.height);
          var u=c.toDataURL('image/webp',0.85);
          if(u.indexOf('data:image/webp')!==0) u=c.toDataURL('image/png');
          if(u.length>180000&&max>160){max=Math.round(max*0.7);return enc();}
          return u;
        }
        try{res(enc());}catch(e){rej(e);}
      };
      img.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}

/* ---------- Stoppuhren (eine pro Sportler) ---------- */
var raf=0,wl=null;
function lock(){try{if(navigator.wakeLock){navigator.wakeLock.request('screen').then(function(l){wl=l;}).catch(function(){});}}catch(e){}}
function unlock(){try{if(wl)wl.release();}catch(e){}wl=null;}
function getRun(id){return S.runs[id]||(S.runs[id]={status:'idle',t0:0,laps:[],marks:[],final:null,saved:false,cfg:null});}
function snapCfg(){return {pool:S.cfg.pool,family:S.cfg.family,disc:S.cfg.disc,discLabel:discLabel(),distance:effDist(),laps:totalLaps()};}
function anyRunning(){return Object.keys(S.runs).some(function(k){return S.runs[k].status==='running';});}
function isLocked(id){var r=S.runs[id];return !!r&&r.status!=='idle'&&!r.saved;}
function begin(id,t0){var r=getRun(id);if(r.status!=='idle')return;r.status='running';r.t0=t0;r.laps=[];r.marks=[];r.final=null;r.saved=false;r.cfg=snapCfg();S.open[id]=false;S.open[id+'z']=false;}
function after(){
  if(anyRunning()){lock();if(!raf)raf=requestAnimationFrame(loop);} else unlock();
  render();
}
function loop(){tickOnce();if(anyRunning())raf=requestAnimationFrame(loop);else raf=0;}
function tickOnce(){
  var now=performance.now();
  document.querySelectorAll('[data-live]').forEach(function(n){
    var r=S.runs[n.getAttribute('data-live')];
    if(r&&r.status==='running') n.textContent=fmt(now-r.t0);
  });
}
function startOne(id){if(effDist()<=0)return;begin(id,performance.now());after();}
function startAll(){
  if(effDist()<=0)return;
  var t=performance.now();
  selIds().forEach(function(id){begin(id,t);});
  after();
}
function finishRun(r,now){r.final=now;r.status='done';}
function lap(id){
  var r=getRun(id); if(r.status!=='running')return;
  var now=performance.now()-r.t0; r.laps.push(now);
  if(r.laps.length>=r.cfg.laps) finishRun(r,now);
  after();
}
function stopOne(id){
  var r=getRun(id); if(r.status!=='running')return;
  var now=performance.now()-r.t0; r.laps.push(now); finishRun(r,now); after();
}
function stopAll(){
  selIds().forEach(function(id){
    var r=getRun(id);
    if(r.status==='running'){var now=performance.now()-r.t0;r.laps.push(now);finishRun(r,now);}
  });
  after();
}
function markRun(id){
  var r=getRun(id); if(r.status!=='running')return;
  var t=performance.now()-r.t0,prev=r.marks.length?r.marks[r.marks.length-1].t:0;
  r.marks.push({t:t,lap:r.marks.length+1});
  toast('Bahn '+r.marks.length+': '+fmt(t)+' (+'+fmtLap(t-prev)+')'); after();
}
function markLines(marks){
  return (marks||[]).map(function(m,i){return 'Bahn '+(i+1)+': '+fmt(m.t)+' (+'+fmtLap(m.t-(i?marks[i-1].t:0))+')';});
}
function undoRun(id){
  var r=getRun(id); if(r.saved)return;
  var lastLap=r.laps.length?r.laps[r.laps.length-1]:-1,lastMark=r.marks.length?r.marks[r.marks.length-1].t:-1;
  if(lastLap<0&&lastMark<0)return;
  if(lastMark>lastLap){r.marks.pop();}
  else{r.laps.pop();if(r.status==='done'){r.status='running';r.final=null;}}
  after();
}
function resetOne(id){delete S.runs[id];after();}

/* ---------- Pool ---------- */
function addPool(name){
  var p={id:pid(),name:name};
  S.pool.push(p);S.sel.push(p.id);persistPool();persistSel();
}
function removePool(id){
  S.pool=S.pool.filter(function(p){return p.id!==id;});
  S.sel=S.sel.filter(function(i){return i!==id;});
  delete S.runs[id];persistPool();persistSel();render();
}
function toggleSel(id){
  var i=S.sel.indexOf(id);
  if(i>-1){S.sel.splice(i,1);var r=S.runs[id];if(r&&(r.status==='idle'||r.saved))delete S.runs[id];}
  else S.sel.push(id);
  persistSel();render();
}

/* ---------- Bausteine ---------- */
function seg(opts,cur,onPick,label){
  var box=h('div',{class:'seg',role:'group','aria-label':label});
  opts.forEach(function(o){
    var b=h('button',{type:'button','aria-pressed':String(o.v===cur),text:o.l,onclick:function(){
      box.querySelectorAll('button').forEach(function(x){x.setAttribute('aria-pressed','false');});
      b.setAttribute('aria-pressed','true');onPick(o.v);
    }});
    box.append(b);
  });
  return box;
}
function armed(label,armedLabel,fn,cls){
  var b=h('button',{type:'button',class:'btn '+cls,text:label}),t=null;
  b.addEventListener('click',function(){
    if(b.dataset.armed){clearTimeout(t);fn();return;}
    b.dataset.armed='1';b.textContent=armedLabel;b.classList.add('armed');
    t=setTimeout(function(){delete b.dataset.armed;b.textContent=label;b.classList.remove('armed');},3500);
  });
  return b;
}
function iconArmed(aria,fn,disabled){
  var b=h('button',{type:'button',class:'icon','aria-label':aria,text:'×',disabled:!!disabled}),t=null;
  b.addEventListener('click',function(){
    if(b.dataset.armed){clearTimeout(t);fn();return;}
    b.dataset.armed='1';b.textContent='Löschen?';b.classList.add('armed');
    t=setTimeout(function(){delete b.dataset.armed;b.textContent='×';b.classList.remove('armed');},3500);
  });
  return b;
}
var toastT=null;
function toast(msg){var t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){t.hidden=true;},2600);}
function splitsBox(id,laps){
  var rows=laps.map(function(c,i){
    return h('tr',{},h('td',{text:String(i+1)}),h('td',{text:fmtLap(c-(i?laps[i-1]:0))}),h('td',{text:fmt(c)}));
  });
  var det=h('details',{class:'splits',ontoggle:function(){S.open[id]=det.open;}},
    h('summary',{text:'Bahnzeiten ('+laps.length+')'}),
    h('div',{class:'tbl'},h('table',{},h('thead',{},h('tr',{},h('th',{text:'Bahn'}),h('th',{text:'Zeit'}),h('th',{text:'Gesamt'}))),h('tbody',{},rows))));
  if(S.open[id]) det.setAttribute('open','');
  return det;
}

  },'Schwimmart');

    h('div',{class:'bh'},h('h2',{text:'Strecke'}),h('span',{class:'muted',text:'gilt für den nächsten Start'})),
    h('div',{class:'setup'},
      h('div',{},h('span',{class:'lbl',text:'Bahnlänge'}),pool),
      h('div',{},h('span',{class:'lbl',text:'Schwimmart'}),fam),

function marksLine(r){
  if(!r.marks||!r.marks.length) return null;
  return h('div',{class:'marks'},h('span',{class:'lbl',text:'Zwischenzeiten'}),
    h('div',{class:'chips'},markLines(r.marks).map(function(t){return h('span',{class:'badge',text:t});})));
}
function athRow(id){
  var r=getRun(id),name=poolName(id),st=r.status,cfg=r.cfg,prog,tEl,row2,sp=null;
  if(st==='idle'){
    prog='Bereit';
    tEl=h('div',{class:'t off',text:fmt(0)});
    row2=h('div',{class:'r-idle'},h('button',{type:'button',class:'btn primary lap',disabled:effDist()<=0,onclick:function(){startOne(id);},text:effDist()>0?'Start':'Strecke eintragen'}));
  } else if(st==='running'){
    var n=r.laps.length;
    prog='Bahn '+Math.min(n+1,cfg.laps)+' von '+cfg.laps+(n?' · letzte '+fmtLap(r.laps[n-1]-(n>1?r.laps[n-2]:0)):'');
    tEl=h('div',{class:'t','data-live':id,text:fmt(performance.now()-r.t0)});
    var isLast=n===cfg.laps-1;
    row2=h('div',{class:'r-run'},
      h('button',{type:'button',class:'btn lap '+(isLast?'stop':'primary'),onclick:function(){lap(id);},text:isLast?'Ziel':'Bahn'}),
      h('button',{type:'button',class:'btn ghost small',onclick:function(){stopOne(id);},text:'Stopp'}),
      h('button',{type:'button',class:'btn ghost small','aria-label':'Letzte Zeit zurücknehmen',disabled:!(n||r.marks.length),onclick:function(){undoRun(id);},text:'Zurück'}));
  } else {
    prog=(r.saved?'Gespeichert':'Im Ziel')+' · '+cfg.discLabel+' '+cfg.distance+' m · '+cfg.pool+'-m-Bahn';
    tEl=h('div',{class:'t',text:fmt(r.final)});
    row2=h('div',{class:'r-done'},
      h('button',{type:'button',class:'btn primary mid',disabled:r.saved,onclick:function(){openSave([id]);},text:r.saved?'Gespeichert':'Speichern'}),
      h('button',{type:'button',class:'btn ghost mid',onclick:function(){openShare(groupFromRuns([id],S.meta));},text:'Teilen'}),
      h('button',{type:'button',class:'btn ghost mid',disabled:r.saved,onclick:function(){undoRun(id);},text:'Zurück'}),
      r.saved?h('button',{type:'button',class:'btn ghost mid',onclick:function(){resetOne(id);},text:'Neuer Lauf'}):armed('Neuer Lauf','Verwerfen?',function(){resetOne(id);},'ghost mid'));
  }
  if(r.laps.length) sp=splitsBox(id,r.laps);
  return h('div',{class:'ath'+(st==='done'?' done':'')},
    h('div',{class:'top'},h('div',{class:'who'},h('div',{class:'nm2',text:name}),h('span',{class:'prog',text:prog})),tEl),
    row2,marksLine(r),sp);
}
function clockPanel(){
  var ids=selIds();
  var list=h('div',{class:'list'});
  if(!ids.length) list.append(h('p',{class:'empty',text:S.pool.length?'Wähle oben mindestens einen Sportler aus.':'Sobald Sportler im Pool sind, erscheint hier für jeden eine eigene Stoppuhr.'}));
  ids.forEach(function(id){list.append(athRow(id));});
  return h('section',{class:'block'},h('div',{class:'bh'},h('h2',{text:'Stoppuhren'}),h('span',{class:'muted',text:'eine pro Sportler'})),list);
}
function viewStop(){return h('div',{class:'stack'},setupPanel(),pickPanel(),clockPanel());}
function renderBar(){
  var bar=$('#bar'); bar.hidden=S.tab!=='stop'; if(bar.hidden) return;
  var ids=selIds(),idle=[],run=[],done=[],unsaved=[];
  ids.forEach(function(id){
    var r=getRun(id);
    if(r.status==='idle') idle.push(id);
    else if(r.status==='running') run.push(id);
    else {done.push(id);if(!r.saved)unsaved.push(id);}
  });
  var label=!ids.length?'Keine Sportler gewählt':[run.length?run.length+' laufen':'',done.length?done.length+' im Ziel':'',idle.length&&(run.length||done.length)?idle.length+' bereit':''].filter(Boolean).join(' · ')||'Alle bereit';
  var btns=h('div',{class:'btns'});
  if(!ids.length){
    btns.append(h('button',{type:'button',class:'btn primary wide',disabled:true,text:'Sportler wählen'}));
  } else {
    if(idle.length) btns.append(h('button',{type:'button',class:'btn primary'+(run.length||done.length?'':' wide'),disabled:effDist()<=0,onclick:startAll,
      text:effDist()<=0?'Strecke eintragen':(idle.length===ids.length?(ids.length===1?'Start':'Alle starten'):idle.length+' starten')}));
    if(run.length) btns.append(h('button',{type:'button',class:'btn stop',onclick:stopAll,text:run.length===1?'Stoppen':'Alle stoppen'}));
    if(unsaved.length) btns.append(h('button',{type:'button',class:'btn primary',onclick:function(){openSave(unsaved);},text:unsaved.length===1?'Speichern':'Alle speichern'}));
    if(done.length) btns.append(h('button',{type:'button',class:'btn ghost',onclick:function(){openShare(groupFromRuns(done,S.meta));},text:'Teilen'}));
    if(done.length&&!unsaved.length&&!run.length) btns.append(h('button',{type:'button',class:'btn ghost',onclick:function(){done.forEach(function(id){delete S.runs[id];});after();},text:'Neuer Lauf'}));
  }
  bar.replaceChildren(h('div',{class:'in'},h('div',{class:'barstat',text:label}),btns));
}

/* ---------- Ergebnisse: Gruppen, Texte, Export ---------- */
function ranked(arr){
  var t=arr.filter(function(a){return a.time!=null;}).sort(function(a,b){return a.time-b.time;});
  var out=[],prev=null,pr=0;
  t.forEach(function(a,i){var r=(prev!==null&&a.time===prev)?pr:i+1;prev=a.time;pr=r;out.push(Object.assign({},a,{rank:r}));});
  arr.filter(function(a){return a.time==null;}).forEach(function(a){out.push(Object.assign({},a,{rank:null}));});
  return out;
}
function lapDiffs(sp){return sp.map(function(c,i){return c-(i?sp[i-1]:0);});}
function typeLabel(t){return t==='wk'?'Wettkampf':'Training';}
function groupFromRuns(ids,meta){
  var map={},order=[];
  ids.forEach(function(id){
    var r=S.runs[id]; if(!r||r.status!=='done') return;
    var c=r.cfg,key=[c.disc,c.distance,c.pool].join('|');
    if(!map[key]){map[key]={date:meta.date,type:meta.type,title:meta.title,note:meta.note,pool:c.pool,family:c.family,disc:c.disc,discLabel:c.discLabel,distance:c.distance,athletes:[]};order.push(key);}
    map[key].athletes.push({name:poolName(id),time:r.final,splits:r.laps.slice(),marks:r.marks.slice()});
  });
  return order.map(function(k){return map[k];});
}
function groupResults(list){
  var map={},order=[];
  list.forEach(function(r){
    var key=[r.date,r.type,r.title,r.disc,r.distance,r.pool].join('|');
    if(!map[key]){map[key]={date:r.date,type:r.type,title:r.title||'',note:'',pool:r.pool,family:r.family,disc:r.disc,discLabel:r.discLabel,distance:r.distance,athletes:[],newest:0};order.push(key);}
    var g=map[key];
    g.athletes.push({rid:r.id,name:r.name,time:r.time,splits:r.splits||[],marks:r.marks||[]});
    if(!g.note&&r.note) g.note=r.note;
    g.newest=Math.max(g.newest,r.createdAt||0);
  });
  return order.map(function(k){return map[k];}).sort(function(a,b){return (b.date||'').localeCompare(a.date||'')||b.newest-a.newest;});
}
function buildText(groups,sp){
  var g0=groups[0];
  var L=['*Tauchsportclub Marzahn*',[typeLabel(g0.type),g0.title].filter(Boolean).join(' · '),'Datum: '+dateShort(g0.date)];
  var note='';
  groups.forEach(function(g){
    L.push('');L.push('━━━━━━━━━━━━');
    L.push('*'+g.discLabel+' '+g.distance+' m*');
    L.push(g.pool+'-m-Bahn · '+Math.max(1,Math.ceil(g.distance/g.pool))+' Bahnen');
    ranked(g.athletes).forEach(function(a){
      L.push('');
      L.push((a.rank?a.rank+'. ':'– ')+'*'+a.name+'*');
      L.push('Endzeit: '+(a.time!=null?fmt(a.time):'keine Zeit'));
      if(sp&&a.splits.length>1){
        a.splits.forEach(function(c,i){L.push('Bahn '+(i+1)+': '+fmt(c)+' (+'+fmtLap(c-(i?a.splits[i-1]:0))+')');});
      }
      if(sp&&a.marks&&a.marks.length) markLines(a.marks).forEach(function(t){L.push('Zwischenzeit '+t);});
    });
    if(!note&&g.note) note=g.note;
  });
  if(note){L.push('');L.push(note);}
  return L.join('\n');
}
function csvOf(groups){
  var q=function(v){return '"'+String(v==null?'':v).replace(/"/g,'""')+'"';};
  var rows=[['Datum','Art','Titel','Disziplin','Strecke (m)','Bahnlänge (m)','Rang','Name','Zeit','Bahnzeiten','Zwischenzeiten'].map(q).join(';')];
  groups.forEach(function(g){
    ranked(g.athletes).forEach(function(a){
      rows.push([dateShort(g.date),typeLabel(g.type),g.title,g.discLabel,g.distance,g.pool,a.rank||'',a.name,a.time!=null?fmt(a.time):'',lapDiffs(a.splits).map(fmtLap).join(' | '),markLines(a.marks).join(' | ')].map(q).join(';'));
    });
  });
  return '﻿'+rows.join('\r\n');
}
function saveCsv(groups,name){
  if(!S.dl) return;
  S.dl.save({filename:name,data:csvOf(groups)}).then(function(){toast('Datei gespeichert');}).catch(function(e){if(!e||e.code!=='declined')toast('Speichern der Datei nicht möglich');});
}
function saveRuns(ids,meta){
  var n=0;
  ids.forEach(function(id){
    var r=S.runs[id]; if(!r||r.status!=='done'||r.saved) return;
    var c=r.cfg;
    var res={kind:'result',id:rid(),date:meta.date,type:meta.type,title:meta.title,note:meta.note,pool:c.pool,family:c.family,disc:c.disc,discLabel:c.discLabel,
      distance:c.distance,laps:c.laps,athleteId:id,name:poolName(id),time:r.final,splits:r.laps.slice(),marks:r.marks.slice(),createdAt:Date.now()};
    S.results.unshift(res);cset(res.id,res);r.saved=true;n++;
  });
  lsSet('bz.results',S.results);
  return n;
}
function deleteResult(id){
  S.results=S.results.filter(function(r){return r.id!==id;});lsSet('bz.results',S.results);cdel(id);render();toast('Gelöscht');
}

var sheetOpen=false;
function openSheet(title,body){
  var sp=$('#sp');
  sp.replaceChildren(h('div',{class:'sh-head'},h('h2',{id:'sheetTitle',text:title}),h('button',{type:'button',class:'icon','aria-label':'Schließen',onclick:closeSheet,text:'×'})),h('div',{class:'sbody'},body));
  $('#sheet').hidden=false;sheetOpen=true;
}
function closeSheet(){$('#sheet').hidden=true;sheetOpen=false;}
function openSave(ids){
  ids=ids.filter(function(id){var r=S.runs[id];return r&&r.status==='done'&&!r.saved;});
  if(!ids.length) return;
  var m=S.meta;
  var dateI=h('input',{type:'date',id:'sv-date',value:m.date});
  var titleI=h('input',{type:'text',id:'sv-title',maxlength:'80',value:m.title,placeholder:'z. B. Dienstagstraining oder Berliner Meisterschaft'});
  var noteI=h('textarea',{id:'sv-note',rows:'2',maxlength:'300',placeholder:'Notiz (optional)'},m.note);
  var type=m.type;
  var typeSeg=seg([{v:'tr',l:'Training'},{v:'wk',l:'Wettkampf'}],type,function(v){type=v;},'Art');
  var prev=h('div',{class:'prev'},ids.map(function(id){var r=S.runs[id];return h('div',{text:poolName(id)+' · '+r.cfg.discLabel+' '+r.cfg.distance+' m · '+fmt(r.final)});}));
  var body=h('div',{class:'sbody',style:'margin:0'},
    prev,
    h('div',{},h('label',{class:'lbl',for:'sv-date',text:'Datum'}),dateI),
    h('div',{},h('span',{class:'lbl',text:'Art'}),typeSeg),
    h('div',{},h('label',{class:'lbl',for:'sv-title',text:'Name des Trainings oder Wettkampfs'}),titleI),
    h('div',{},h('label',{class:'lbl',for:'sv-note',text:'Notiz'}),noteI),
    h('div',{class:'btns'},
      h('button',{type:'button',class:'btn primary',text:ids.length===1?'Ergebnis speichern':ids.length+' Ergebnisse speichern',onclick:function(){
        if(!dateI.value){toast('Bitte ein Datum wählen');return;}
        S.meta={date:dateI.value,type:type,title:titleI.value.trim(),note:noteI.value.trim()};
        lsSet('bz.type',type);
        var n=saveRuns(ids,S.meta);
        S.meta.note='';
        closeSheet();toast(n===1?'Ergebnis gespeichert':n+' Ergebnisse gespeichert');render();
      }}),
      h('button',{type:'button',class:'btn ghost',text:'Abbrechen',onclick:closeSheet})));
  openSheet(ids.length===1?'Ergebnis speichern':'Ergebnisse speichern',body);
}
function openShare(groups){
  if(!groups||!groups.length) return;
  var ta=h('textarea',{id:'sh-text',readonly:true,rows:'14','aria-label':'Ergebnistext'});
  var chk=h('input',{type:'checkbox',id:'sh-splits',checked:true});
  var wa=h('a',{class:'btn primary',target:'_blank',rel:'noopener',text:'In WhatsApp senden'});
  function upd(){var t=buildText(groups,chk.checked);ta.value=t;wa.href='https://wa.me/?text='+encodeURIComponent(t);}
  chk.addEventListener('change',upd);
  var copy=h('button',{type:'button',class:'btn ghost',text:'Text kopieren',onclick:function(){
    var t=ta.value;
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(t).then(function(){toast('Kopiert');}).catch(function(){ta.focus();ta.select();toast('Text markiert. Bitte manuell kopieren.');});
    } else {ta.focus();ta.select();toast('Text markiert. Bitte manuell kopieren.');}
  }});
  var csv=S.dl?h('button',{type:'button',class:'btn ghost',text:'Als Tabelle (CSV)',onclick:function(){saveCsv(groups,'bahnzeit-'+(groups[0].date||todayISO())+'.csv');}}):null;
  var body=h('div',{class:'sbody',style:'margin:0'},
    ta,h('label',{class:'chk',for:'sh-splits'},chk,'Alle Bahnzeiten mitsenden'),
    h('div',{class:'btns'},wa,copy,csv));
  openSheet('Ergebnisse teilen',body);upd();
}

/* ---------- Ergebnisse ---------- */
function groupCard(g){
  var rows=ranked(g.athletes).map(function(a){
    var hasMore=a.splits.length>1||(a.marks&&a.marks.length);
    var more=hasMore?h('details',{class:'more'},h('summary',{class:'muted',text:'Bahn- und Zwischenzeiten'}),
      a.splits.length>1?h('p',{class:'tbl',style:'margin:4px 0 0'},'Bahnen: '+lapDiffs(a.splits).map(fmtLap).join(' · ')):null,
      a.marks&&a.marks.length?h('div',{class:'tbl'},markLines(a.marks).map(function(t){return h('div',{text:t});})):null):null;
    return h('div',{class:'res'},h('span',{class:'rk',text:a.rank?String(a.rank):'–'}),h('span',{class:'nm',text:a.name}),h('span',{class:'tm',text:a.time!=null?fmt(a.time):'–'}),
      iconArmed(a.name+' löschen',function(){deleteResult(a.rid);}),more);
  });
  return h('article',{class:'sess'},
    h('div',{class:'sh'},h('span',{class:'date',text:dateLong(g.date)}),h('span',{class:'badge'+(g.type==='wk'?' wk':''),text:typeLabel(g.type)})),
    g.title?h('div',{class:'stitle',text:g.title}):null,
    h('div',{class:'muted',text:g.discLabel+' · '+g.distance+' m · '+g.pool+'-m-Bahn'}),
    h('div',{},rows),
    g.note?h('div',{class:'muted',text:g.note}):null,
    h('div',{class:'acts'},h('button',{type:'button',class:'btn ghost',text:'Teilen',onclick:function(){openShare([g]);}})));
}
function viewRes(){
  var allG=groupResults(S.results);
  var nTr=allG.filter(function(g){return g.type!=='wk';}).length,nWk=allG.length-nTr;
  var list=allG.filter(function(g){return S.filter==='all'||(S.filter==='wk'?g.type==='wk':g.type!=='wk');});
  var chips=h('div',{class:'chips'},[['all','Alle ('+allG.length+')'],['tr','Training ('+nTr+')'],['wk','Wettkampf ('+nWk+')']].map(function(f){
    return h('button',{type:'button',class:'chip','aria-pressed':String(S.filter===f[0]),text:f[1],onclick:function(){S.filter=f[0];render();}});
  }));
  var root=h('div',{class:'stack'},chips);
  if(!list.length){
    root.append(h('div',{class:'panel'},h('p',{class:'sumline',text:allG.length?'Keine Einträge in diesem Filter.':'Noch keine Ergebnisse gespeichert.'}),
      h('p',{class:'muted',text:allG.length?'Wähle oben einen anderen Filter.':'Stoppe einen Sportler und speichere sein Ergebnis mit Datum und Art (Training oder Wettkampf). Es erscheint dann hier.'})));
  } else {
    root.append(h('div',{class:'cards'},list.map(groupCard)));
    if(S.dl) root.append(h('button',{type:'button',class:'btn ghost',text:'Alle als Tabelle (CSV) sichern',onclick:function(){saveCsv(list,'bahnzeit-ergebnisse.csv');}}));
  }
  return root;
}

/* ---------- Einstellungen ---------- */
function viewSet(){
  var rows=S.pool.map(function(p){
    return h('div',{class:'poolrow'},
      h('input',{type:'text',value:p.name,maxlength:'40','aria-label':'Name',autocomplete:'off',oninput:function(e){p.name=e.target.value;persistPool();}}),
      iconArmed((p.name||'Sportler')+' aus dem Pool löschen',function(){removePool(p.id);},isLocked(p.id)));
  });
  var newI=h('input',{type:'text',id:'new-ath',maxlength:'40',autocomplete:'off',placeholder:'Vor- und Nachname'});
  var form=h('form',{class:'addrow',onsubmit:function(e){
    e.preventDefault();var v=newI.value.trim();if(!v)return;
    addPool(v);render();requestAnimationFrame(function(){var i=$('#new-ath');if(i)i.focus();});
  }},
    h('div',{},h('label',{class:'lbl',for:'new-ath',text:'Neuer Sportler'}),newI),
    h('button',{type:'submit',class:'btn primary',text:'Hinzufügen'}));
  var pool=h('section',{class:'panel'},h('h2',{text:'Sportler-Pool'}),
    h('p',{class:'muted',text:'Alle Sportler des Vereins. Beim Stoppen wählst du daraus aus. Namen änderst du direkt im Feld. Bereits gespeicherte Ergebnisse behalten den Namen von damals.'}),
    rows.length?h('div',{class:'stack',style:'gap:8px'},rows):h('p',{class:'muted',text:'Noch niemand im Pool.'}),
    form);
  var file=h('input',{type:'file',accept:'image/*',id:'logo-file',hidden:true,onchange:function(e){
    var f=e.target.files&&e.target.files[0]; if(!f) return;
    shrink(f).then(function(u){
      S.logo=u;lsSet('bz.logo',u);cset('logo',{src:u});applyLogo();render();toast('Logo gespeichert');
    }).catch(function(){toast('Das Bild konnte nicht gelesen werden');});
  }});
  var prev=h('div',{class:'logoprev'});
  prev.style.backgroundImage='url("'+curLogo()+'")';
  var store=S.storage==='cloud'
    ?'Pool, Ergebnisse und Logo werden in deinem Konto gesichert und sind auf deinen Geräten verfügbar.'
    :'Pool, Ergebnisse und Logo liegen nur auf diesem Gerät. Die Sicherung im Konto ist gerade nicht verfügbar. Sichere wichtige Ergebnisse über Teilen oder CSV.';
  return h('div',{class:'stack'},pool,
    h('section',{class:'panel'},h('h2',{text:'Vereinslogo'}),
      h('p',{class:'muted',text:'Das Logo des Tauchsportclubs Marzahn steht neben dem Titel und blass im Hintergrund. Du kannst ein anderes Bild wählen.'}),
      prev,file,
      h('div',{class:'acts'},
        h('button',{type:'button',class:'btn primary',text:'Anderes Logo wählen',onclick:function(){file.click();}}),
        S.logo?h('button',{type:'button',class:'btn ghost',text:'Standard-Logo',onclick:function(){S.logo=null;lsDel('bz.logo');cdel('logo');applyLogo();render();}}):null)),
    h('section',{class:'panel'},h('h2',{text:'Speicherort'}),h('p',{text:store})),
    h('section',{class:'panel'},h('h2',{text:'Strecken'}),
      h('p',{class:'muted',text:'Die Strecken pro Disziplin sind Vorschläge. Mit „Andere“ trägst du jede beliebige Strecke ein, die Bahnen werden aus der Bahnlänge berechnet.'})));
}

/* ---------- Rendern ---------- */
function render(){
  document.querySelectorAll('.tabs button').forEach(function(b){b.setAttribute('aria-selected',String(b.dataset.tab===S.tab));});
  $('#view').replaceChildren(S.tab==='stop'?viewStop():S.tab==='res'?viewRes():viewSet());
  renderBar();tickOnce();
}
document.querySelectorAll('.tabs button').forEach(function(b){
  b.addEventListener('click',function(){S.tab=b.dataset.tab;render();window.scrollTo(0,0);});
});
$('#scrim').addEventListener('click',closeSheet);
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&sheetOpen)closeSheet();});
applyLogo();render();initCloud();
})();
</script>

<script>
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}
</script>
</body>
</html>
