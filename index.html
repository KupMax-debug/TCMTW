<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Stoppuhr TCM</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0A7C91">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Stoppuhr TCM">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>
/* Layout: Poolside-Stoppuhr. Kopf mit Logo und Leinen-Streifen, drei Tabs; Strecke, Sportlerwahl und je Sportler eine Reihe kleiner Stoppuhren (Startknopf links oder rechts); feste Steuerleiste unten. Belastungszonen (5-Zonen-Modell) als geordnete Farbskala kalt nach warm. */
:root{
  --bg:#EAF1F1; --surface:#F8FBFB; --surface-2:#DCE8E8; --ink:#0C2730; --muted:#4C6770; --line:#C5D6D6;
  --accent:#0A7C91; --accent-ink:#FFFFFF; --stop:#D9441E; --stop-ink:#FFFFFF; --ok:#1E8A5A; --warn:#8F5E00; --rope-w:#F8FBFB;
  --a0:#8E5BD0; --a1:#D1478A; --a2:#3D6FD6; --a3:#B8742A; --a4:#2E9C8A; --a5:#C4504A; --a6:#5C7F2A; --a7:#6A7A8C;
  --z0:#9AA6AB; --z1:#2A78D6; --z2:#1BAF7A; --z3:#EDA100; --z4:#E34948;
  --display:'Barlow Condensed','Arial Narrow',system-ui,sans-serif; --body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#081A20; --surface:#102830; --surface-2:#17353F; --ink:#E3F0F1; --muted:#8DAAB2; --line:#24444E;
    --accent:#3FC1D9; --accent-ink:#06222A; --stop:#FF7A57; --stop-ink:#2A0C03; --ok:#52C98C; --warn:#E3B341; --rope-w:#D8E8EA;
    --a0:#B28CEB; --a1:#EE7FB2; --a2:#7FA3F0; --a3:#E0A25A; --a4:#5CC7B3; --a5:#E88A82; --a6:#A3C766; --a7:#9BAABB;
    --z0:#6F8087; --z1:#3987E5; --z2:#199E70; --z3:#C98500; --z4:#E66767; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#081A20; --surface:#102830; --surface-2:#17353F; --ink:#E3F0F1; --muted:#8DAAB2; --line:#24444E;
  --accent:#3FC1D9; --accent-ink:#06222A; --stop:#FF7A57; --stop-ink:#2A0C03; --ok:#52C98C; --warn:#E3B341; --rope-w:#D8E8EA;
  --a0:#B28CEB; --a1:#EE7FB2; --a2:#7FA3F0; --a3:#E0A25A; --a4:#5CC7B3; --a5:#E88A82; --a6:#A3C766; --a7:#9BAABB;
    --z0:#6F8087; --z1:#3987E5; --z2:#199E70; --z3:#C98500; --z4:#E66767; color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
body{background:var(--bg);color:var(--ink);font:400 16px/1.4 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:12px 200px}
#logoBg{position:fixed;inset:0;z-index:0;pointer-events:none;background:center / min(82vw,540px) no-repeat;opacity:.09}
.app{position:relative;z-index:1;max-width:640px;margin:0 auto}
.brand{display:flex;align-items:center;gap:14px}
.brand h1{margin-bottom:0}
.mark{height:60px;width:auto;flex:none}
.brand+.rope{margin-top:10px}
.club{margin:0;font:600 12px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
h1{margin:6px 0 10px;font:700 46px/1 var(--display);letter-spacing:.01em;text-wrap:balance}
h2{margin:0;font:700 22px/1.1 var(--display);letter-spacing:.02em;text-transform:uppercase}
.rope{height:8px;border-radius:4px;background:repeating-linear-gradient(90deg,var(--stop) 0 18px,var(--rope-w) 18px 36px,var(--accent) 36px 54px,var(--rope-w) 54px 72px)}
.tabs{display:flex;gap:4px;margin:14px 0 16px;border-bottom:1px solid var(--line)}
.tabs button{flex:1;min-height:48px;border:0;border-bottom:3px solid transparent;background:transparent;color:var(--muted);font:600 17px var(--body);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.stack{display:grid;gap:18px}
.block{display:grid;gap:10px}
.bh{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.muted{color:var(--muted)}
.small{font-size:14px}
.lbl{display:block;margin-bottom:6px;font:600 12px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.setup{display:grid;gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.seg{display:flex;gap:3px;background:var(--surface-2);border-radius:10px;padding:3px}
.seg button{flex:1;min-width:0;min-height:46px;border:0;border-radius:8px;background:transparent;color:var(--ink);font:600 16px var(--body);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg.mini{min-width:150px}
.seg.mini button{min-height:38px;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:46px;padding:0 16px;border:1px solid var(--line);border-radius:999px;background:var(--bg);color:var(--ink);font:600 16px var(--body);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip:disabled{opacity:.55;cursor:default}
.sumline{margin:0;font:600 17px/1.3 var(--body)}
input[type=text],input[type=date],input[type=number],textarea{width:100%;min-height:48px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:400 16px var(--body)}
textarea{padding:10px 12px;resize:vertical;line-height:1.4}
.stepper{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.stepper input{width:84px;text-align:center;font-weight:600;font-size:20px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.empty{margin:0;padding:18px 16px;color:var(--muted)}
.ath{padding:12px 14px;border-top:1px solid var(--line);display:grid;gap:6px}
.ath:first-child{border-top:0}
.ath{border-left:6px solid var(--ac,transparent);background:color-mix(in srgb,var(--ac,transparent) 7%,transparent)}
.dot::before{content:'';display:inline-block;width:11px;height:11px;border-radius:50%;background:var(--ac,var(--muted));margin-right:8px;flex:none;box-shadow:0 0 0 2px var(--surface)}
.nm2{display:flex;align-items:center}
.pcard.ac{border-left:6px solid var(--ac)}
.ahead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.nm2{font:600 21px/1.2 var(--body);overflow-wrap:anywhere}
.astat{font:600 14px var(--body);color:var(--muted);font-variant-numeric:tabular-nums}
.icon{min-width:46px;height:46px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:500 26px/1 var(--body);cursor:pointer}
.icon.armed{padding:0 10px;font:600 14px var(--body);border-color:var(--stop);color:var(--stop)}
.rgroup{border-top:1px solid var(--line)}.rgroup:first-child{border-top:0}
.rghead{padding:8px 14px 2px;background:var(--bg)}
.rrow{border-top:1px solid var(--line);border-left:6px solid var(--ac,transparent);background:color-mix(in srgb,var(--ac,transparent) 7%,transparent);padding:6px 12px 6px 10px}
.rrow:first-of-type{border-top:0}
.rrow .rep{border-top:0;padding:2px 0;align-items:center}
.rrow .rctl{width:132px}
.nm3{display:flex;align-items:center;font:600 18px/1.2 var(--body);overflow-wrap:anywhere}
.rrow .t{font-size:26px}
.rrow .btn.mainbtn{min-height:50px;font-size:20px}
.rdetails{margin:0}
.rdetails>summary{display:flex;align-items:center;flex-wrap:wrap;min-height:32px}
.rdet{display:grid;gap:8px;padding:6px 0 4px}
.rep{display:flex;gap:10px;align-items:stretch;padding:8px 0;border-top:1px solid var(--line)}
body.lefty .rep{flex-direction:row-reverse}
.rinfo{flex:1;min-width:0;display:grid;gap:4px;align-content:start}
.rctl{flex:none;width:124px;display:grid;gap:6px;align-content:start}
.rtime{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.rn{font:600 13px var(--body);color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.t{font:700 30px/1 var(--display);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.t.off{color:var(--muted)}
.rep.done .t{color:var(--ok)}
.prog{font-size:13px;color:var(--muted)}
.zsel{min-height:40px;max-width:100%;padding:0 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:500 15px var(--body)}
.erows{display:grid}
.erow{display:grid;gap:6px;padding:8px 0;border-top:1px solid var(--line)}
.et{font:700 20px var(--display);font-variant-numeric:tabular-nums}
.prow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
input.pin{width:72px;min-height:40px;padding:0 6px;text-align:center;font-weight:600}
.btn{min-height:52px;padding:0 18px;border:1px solid transparent;border-radius:10px;font:600 18px var(--body);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.stop{background:var(--stop);color:var(--stop-ink)}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn.armed{border-color:var(--stop);color:var(--stop)}
.btn.mainbtn{width:100%;min-height:56px;font:700 22px var(--display);letter-spacing:.04em;text-transform:uppercase}
.btn.tiny{min-height:40px;padding:0 6px;font-size:14px}
.btn.mid{min-height:46px;font-size:16px}
.btn:disabled,.icon:disabled{opacity:.4;cursor:default}
.auxrow{display:grid;grid-template-columns:1fr 1fr;gap:6px}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
details>summary{cursor:pointer;color:var(--muted);font-size:14px;min-height:28px}
.zchip{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;background:var(--surface-2);font:600 13px var(--body);white-space:nowrap}
.zchip i{width:10px;height:10px;border-radius:50%;background:var(--zc);display:inline-block}
.rel-ok{color:var(--ok);font-weight:600;font-size:13px}
.rel-low,.rel-high{color:var(--warn);font-weight:600;font-size:13px}
.vb{display:inline-flex;align-items:center;padding:2px 10px;border-radius:999px;border:1px solid currentColor;font:600 13px var(--body);white-space:nowrap}
.vb.ok{color:var(--ok)} .vb.part{color:var(--warn)} .vb.miss{color:var(--stop)}
.eval{display:grid;gap:12px;padding-top:6px}
.evsum{display:grid;gap:6px}
.vline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cbox{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.chart{display:block;height:auto}
.chart text{font-family:var(--body)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:8px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.legend b{color:var(--ink)}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px;margin-top:2px;width:100%}
.tbl th,.tbl td{padding:4px 7px 4px 0;text-align:left;white-space:nowrap}
.tbl th{font-weight:600;color:var(--muted);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.tbl input.pin{min-height:36px;width:64px}
#bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#bar .in{max-width:640px;margin:0 auto;display:grid;gap:8px}
.barstat{font:700 24px/1.1 var(--display);letter-spacing:.02em}
.btns{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}
.btns .wide{grid-column:1/-1}
.cards{display:grid;gap:14px}
.sess{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:10px}
.sh{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.date{font:700 20px/1.1 var(--display);letter-spacing:.02em}
.badge{padding:3px 10px;border-radius:999px;font:600 13px var(--body);background:var(--surface-2);color:var(--ink)}
.badge.wk{background:var(--accent);color:var(--accent-ink)}
.stitle{font-weight:600}
.resb{display:grid;gap:4px;padding:8px 0;border-top:1px solid var(--line)}
.res{display:grid;grid-template-columns:28px minmax(0,1fr) auto auto;gap:8px;align-items:center}
.rk{font:700 20px var(--display);color:var(--muted)}
.nm{font-weight:500;overflow-wrap:anywhere}
.tm{font:700 24px var(--display);font-variant-numeric:tabular-nums}
.res .icon{min-width:40px;height:40px;font-size:22px}
.resb .meta{padding-left:36px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.resb details{padding-left:36px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.acts .btn{min-height:46px;font-size:16px;flex:1}
.logoprev{width:120px;height:120px;border:1px dashed var(--line);border-radius:12px;background:center / contain no-repeat var(--surface-2);display:grid;place-items:center;color:var(--muted);font-size:13px;text-align:center;padding:6px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:12px}
.panel p{margin:0}
.poolrow{display:grid;grid-template-columns:minmax(0,1fr) 46px;gap:8px;align-items:center}
.pcard{display:grid;gap:12px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pnote{margin:0;font-size:14px}
.zrow{display:grid;grid-template-columns:14px minmax(0,1fr) 92px;gap:10px;align-items:center}
.zrow i{width:14px;height:14px;border-radius:3px;display:block;background:var(--zc)}
.zrow .zn{font-weight:600}
.unit{display:flex;align-items:center;gap:6px}
#sheet{position:fixed;inset:0;z-index:40}
.scrim{position:absolute;inset:0;background:rgba(4,16,20,.55)}
.sp{position:absolute;left:0;right:0;bottom:0;max-height:88%;overflow:auto;background:var(--surface);color:var(--ink);border-top:1px solid var(--line);border-radius:16px 16px 0 0;
  padding-top:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sp>*{max-width:640px;margin-left:auto;margin-right:auto}
.sp .sbody{display:grid;gap:14px;margin-top:12px}
.sh-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.chk{display:flex;align-items:center;gap:10px;min-height:44px;font-weight:500}
.chk input{width:22px;height:22px;accent-color:var(--accent)}
.prev{display:grid;gap:2px;font-size:15px;margin:0;padding:10px 12px;background:var(--surface-2);border-radius:8px}
#toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 12px);z-index:60;max-width:calc(100% - 32px);padding:10px 16px;border-radius:10px;background:var(--ink);color:var(--bg);font-weight:600;text-align:center}
@media (prefers-reduced-motion: no-preference){ .btn,.chip,.seg button{transition:background-color .12s,color .12s} }
</style>
</head>
<body>

<div class="app">
  <header>
    <div class="brand">
      <img id="markLogo" class="mark" alt="Logo Tauchsportclub Marzahn" width="44" height="60">
      <div><p class="club">Tauchsportclub Marzahn</p>
      <h1>Stoppuhr</h1></div>
    </div>
    <div class="rope" aria-hidden="true"></div>
    <nav class="tabs" role="tablist" aria-label="Bereiche">
      <button type="button" role="tab" data-tab="stop" aria-selected="true">Stoppen</button>
      <button type="button" role="tab" data-tab="res" aria-selected="false">Ergebnisse</button>
      <button type="button" role="tab" data-tab="set" aria-selected="false">Einstellungen</button>
    </nav>
  </header>
  <main id="view"></main>
</div>
<div id="logoBg" aria-hidden="true"></div>
<div id="bar" hidden></div>
<div id="sheet" hidden>
  <div class="scrim" id="scrim"></div>
  <div class="sp" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" id="sp"></div>
</div>
<div id="toast" role="status" aria-live="polite" hidden></div>

<script>
(function(){
'use strict';
var $=function(s,r){return (r||document).querySelector(s);};
function h(tag,a){
  var e=document.createElement(tag); a=a||{};

    var v=a[k];
    if(v===false||v==null) return;
    if(k==='class') e.className=v;
    else if(k==='text') e.textContent=v;
    else if(k.slice(0,2)==='on') e.addEventListener(k.slice(2),v);
    else if(v===true) e.setAttribute(k,'');

  });
  for(var i=2;i<arguments.length;i++){
    [].concat(arguments[i]).forEach(function(x){
      if(x==null||x===false) return;
      e.append(x.nodeType?x:document.createTextNode(x));
    });
  }
  return e;
}
var NS='http://www.w3.org/2000/svg';
function sv(tag,a){
  var e=document.createElementNS(NS,tag); a=a||{};
  Object.keys(a).forEach(function(k){var v=a[k];if(v==null||v===false)return;if(k==='text')e.textContent=v;else e.setAttribute(k,v);});
  for(var i=2;i<arguments.length;i++){[].concat(arguments[i]).forEach(function(x){if(x==null||x===false)return;e.append(x.nodeType?x:document.createTextNode(x));});}
  return e;
}
function lsGet(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function lsDel(k){try{localStorage.removeItem(k);}catch(e){}}
var pad=function(n){return String(n).padStart(2,'0');};
function parts(ms){var cs=Math.max(0,Math.floor(ms/10));return {m:Math.floor(cs/6000),s:Math.floor((cs%6000)/100),c:cs%100};}
function fmt(ms){var p=parts(ms);return p.m+':'+pad(p.s)+','+pad(p.c);}

function todayISO(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function dateLong(iso){var a=(iso||'').split('-').map(Number);if(!a[0])return '';return new Date(a[0],a[1]-1,a[2]).toLocaleDateString('de-DE',{weekday:'short',day:'numeric',month:'long',year:'numeric'});}
function dateShort(iso){var a=(iso||'').split('-');return a.length===3?a[2]+'.'+a[1]+'.'+a[0]:'';}
function pid(){return 'p'+Math.random().toString(36).slice(2,8);}
function rid(){return 'r_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}

var DIST_ALL=[50,100,200,400,800,1500];
var DISC={
  fin:[
    {k:'SF',label:'Surface',d:DIST_ALL},
    {k:'AP',label:'Apnoe',d:[25].concat(DIST_ALL)},
    {k:'IM',label:'Immersion',d:DIST_ALL}
  ],
  swim:[
    {k:'FR',label:'Freistil',d:DIST_ALL},
    {k:'BR',label:'Brust',d:DIST_ALL},
    {k:'RU',label:'Rücken',d:DIST_ALL},
    {k:'SM',label:'Schmetterling',d:DIST_ALL},
    {k:'LA',label:'Lagen',d:DIST_ALL}
  ]
};

/* ---------- Belastungszonen (5-Zonen-Modell) ---------- */
var ZN=['RECOM','GA1','GA2','EB','SB'];
var ZLONG=['Regeneration','Grundlagenausdauer 1','Grundlagenausdauer 2','Entwicklungsbereich','Spitzenbereich'];
var ZB_DEF=[60,75,85,92];
function zbOk(a){return Array.isArray(a)&&a.length===4&&a.every(function(v,i){return typeof v==='number'&&isFinite(v)&&v>0&&v<=100&&(i===0||v>a[i-1]);});}
function zoneIdx(pct,zb){var n=0;zb.forEach(function(b){if(pct>=b)n++;});return n;}
function zoneRange(i,zb){
  if(i===0) return 'unter '+zb[0]+' %';
  if(i===4) return 'ab '+zb[3]+' %';
  return zb[i-1]+' bis '+zb[i]+' %';
}
function ageOf(p){return p&&p.birth?new Date().getFullYear()-p.birth:null;}
function calcOk(p){var a=ageOf(p);return !!(p&&p.sex&&a!=null&&a>=5&&a<=100);}
function hfmaxOf(p){
  if(!p) return null;
  if(p.hfmax) return p.hfmax;
  return calcOk(p)?(p.sex==='w'?226:220)-ageOf(p):null;
}
function hfHow(p){
  if(p.hfmax) return 'selbst eingetragen';
  return calcOk(p)?(p.sex==='w'?'Frau: 226':'Mann: 220')+' minus '+ageOf(p)+' Jahre':'';
}
function normPool(p){
  var n=function(v,lo,hi){v=Number(v);return v>=lo&&v<=hi?v:null;};
  return {id:String(p.id),name:String(p.name),sex:(p.sex==='m'||p.sex==='w')?p.sex:null,birth:n(p.birth,1930,new Date().getFullYear()),height:n(p.height,50,250),weight:n(p.weight,10,250),hfmax:n(p.hfmax,100,260)};
}
function poolOut(list){return list.map(function(p){return {id:p.id,name:p.name,sex:p.sex||null,birth:p.birth||null,height:p.height||null,weight:p.weight||null,hfmax:p.hfmax||null};});}

function normalizeResult(r){
  if(!r.reps){
    r.reps=(r.time!=null)?[{n:1,time:r.time,splits:r.splits||[],pulse:null}]:[];
    r.repsN=1;r.target=null;r.hrmax=null;r.zb=null;r.v=3;
  } else if((r.v||0)<3){
    if(Array.isArray(r.zb)&&r.zb.length===5) r.zb=r.zb.slice(0,4); else if(r.zb&&!zbOk(r.zb)) r.zb=null;
    if(r.target!=null) r.target=Math.min(r.target,4);
    r.v=3;
  }
  if(r.target!=null){r.reps.forEach(function(x){if(x.target==null)x.target=r.target;});r.target=null;}
  return r;
}
function convertSession(s){
  return (s.athletes||[]).map(function(a,i){
    return normalizeResult({kind:'result',id:'r_'+String(s.id).slice(2)+'_'+i,date:s.date,type:s.type,title:s.title||'',note:s.note||'',
      pool:s.pool,family:s.family,disc:s.disc,discLabel:s.discLabel,distance:s.distance,laps:s.laps,athleteId:null,
      name:a.name,time:a.time,splits:a.splits||[],createdAt:s.createdAt||Date.now()});
  });
}

var cloud={col:null};
function cset(id,obj){if(!cloud.col)return;cloud.col.doc(id).set(obj).catch(function(){toast('Cloud-Speichern fehlgeschlagen. Lokal gesichert.');});}
function cdel(id){if(!cloud.col)return;cloud.col.doc(id).delete().catch(function(){});}
async function initCloud(){
  try{
    var c=window.claude; if(!c||!c.use) return;
    c.use('downloads').then(function(d){S.dl=d;}).catch(function(){});
    var user=await c.use('user'); var id=user?await user.id():null; if(!id) return;
    var db=await c.use('db'); if(!db) return;
    cloud.col=db.collection('data/users/'+id);
    var first=true;
    cloud.col.onSnapshot(function(snap){
      if(snap.metadata.fromCache) return;
      var cr=[],leg=[],poolDoc=null,rosterDoc=null,logo=null;
      snap.docs.forEach(function(d){
        var x=d.data(); if(!x) return;
        if(d.id.indexOf('r_')===0&&x.kind==='result') cr.push(normalizeResult(x));
        else if(d.id.indexOf('s_')===0&&Array.isArray(x.athletes)) leg.push(x);
        else if(d.id==='pool') poolDoc=x;
        else if(d.id==='roster') rosterDoc=x;
        else if(d.id==='logo') logo=x;
      });
      S.storage='cloud';
      if(first){
        first=false;
        var have={}; cr.forEach(function(r){have[r.id]=1;});
        leg.forEach(function(s){convertSession(s).forEach(function(r){if(!have[r.id]){have[r.id]=1;cr.push(r);cset(r.id,r);}});cdel(s.id);});
        S.results.forEach(function(r){if(!have[r.id]){have[r.id]=1;cr.push(r);cset(r.id,r);}});
        var cl=(poolDoc&&Array.isArray(poolDoc.athletes))?poolDoc.athletes.map(normPool):[];
        var fromLegacy=false;
        if(!cl.length&&rosterDoc&&Array.isArray(rosterDoc.names)){cl=rosterDoc.names.map(function(n){return normPool({id:pid(),name:String(n)});});fromLegacy=true;}
        var ids={}; cl.forEach(function(a){ids[a.id]=1;});
        var added=false; S.pool.forEach(function(a){if(!ids[a.id]){cl.push(a);added=true;}});
        S.pool=cl;
        if(poolDoc&&zbOk(poolDoc.zb)){S.zb=poolDoc.zb.slice();lsSet('bz.zb',S.zb);}
        if(cl.length&&(added||fromLegacy||!poolDoc)) cset('pool',{athletes:poolOut(cl),zb:S.zb});
        lsSet('bz.pool',S.pool);
        S.sel=S.sel.filter(function(i){return S.pool.some(function(p){return p.id===i;});});
        if(logo&&logo.src){S.logo=logo.src;lsSet('bz.logo',S.logo);} else if(S.logo){cset('logo',{src:S.logo});}
      }
      S.results=cr; lsSet('bz.results',S.results);
      applyLogo();
      var ae=document.activeElement,typing=!!(ae&&ae.tagName==='INPUT'&&$('#view').contains(ae));
      if(!typing&&(S.tab!=='stop'||!anyRunning())) render();
    },function(){S.storage='local';if(S.tab==='set')render();});
  }catch(e){}
}

function curLogo(){return S.logo||DEF_LOGO;}
function applyLogo(){$('#logoBg').style.backgroundImage='url("'+curLogo()+'")';var m=$('#markLogo');if(m)m.src=curLogo();}
function shrink(file){
  return new Promise(function(res,rej){
    var fr=new FileReader(); fr.onerror=rej;
    fr.onload=function(){
      var img=new Image(); img.onerror=rej;
      img.onload=function(){
        var max=480;
        function enc(){
          var w0=img.naturalWidth||512,h0=img.naturalHeight||512;
          var sc=Math.min(1,max/Math.max(w0,h0));
          var c=document.createElement('canvas'); c.width=Math.max(1,Math.round(w0*sc)); c.height=Math.max(1,Math.round(h0*sc));
          c.getContext('2d').drawImage(img,0,0,c.width,c.height);
          var u=c.toDataURL('image/webp',0.85);
          if(u.indexOf('data:image/webp')!==0) u=c.toDataURL('image/png');
          if(u.length>180000&&max>160){max=Math.round(max*0.7);return enc();}
          return u;
        }
        try{res(enc());}catch(e){rej(e);}
      };
      img.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}

/* ---------- Stoppuhren: pro Sportler ein Satz mit n Wiederholungen ---------- */
var raf=0,wl=null;
function lock(){try{if(navigator.wakeLock){navigator.wakeLock.request('screen').then(function(l){wl=l;}).catch(function(){});}}catch(e){}}
function unlock(){try{if(wl)wl.release();}catch(e){}wl=null;}
function newRep(){return {status:'idle',t0:0,laps:[],final:null,pulse:null,target:null};}
function setFor(id){
  var s=S.sets[id]; if(!s) s=S.sets[id]={started:false,saved:false,cfg:null,reps:[]};
  if(!s.started){
    var n=S.cfg.reps;
    if(s.reps.length!==n){var old=s.reps;s.reps=[];for(var i=0;i<n;i++){var nr=newRep();if(old[i])nr.target=old[i].target;s.reps.push(nr);}}
  }
  return s;
}
function setCfg(s){return s.cfg||snapCfg();}
function isLocked(id){var s=S.sets[id];return !!s&&s.started&&!s.saved;}
function runningRep(s){for(var i=0;i<s.reps.length;i++){if(s.reps[i].status==='running')return i;}return -1;}
function nextIdle(s){for(var i=0;i<s.reps.length;i++){if(s.reps[i].status==='idle')return i;}return -1;}
function doneReps(s){return s.reps.filter(function(r){return r.status==='done';});}
function anyRunning(){return Object.keys(S.sets).some(function(k){return runningRep(S.sets[k])>-1;});}
function beginRep(id,i,t0){
  var s=setFor(id); if(s.saved||runningRep(s)>-1) return false;
  var r=s.reps[i]; if(!r||r.status!=='idle') return false;
  if(!s.started){s.started=true;s.cfg=snapCfg();}
  r.status='running';r.t0=t0;r.laps=[];r.final=null;return true;
}
function after(){
  if(anyRunning()){lock();if(!raf)raf=requestAnimationFrame(loop);} else unlock();
  render();
}
function loop(){tickOnce();if(anyRunning())raf=requestAnimationFrame(loop);else raf=0;}
function tickOnce(){
  var now=performance.now();
  document.querySelectorAll('[data-live]').forEach(function(n){
    var p=n.getAttribute('data-live').split(':'),s=S.sets[p[0]],r=s&&s.reps[Number(p[1])];
    if(r&&r.status==='running') n.textContent=fmt(now-r.t0);
  });
}
function startOne(id,i){if(effDist()<=0)return;if(beginRep(id,i,performance.now()))after();}
function startAll(){
  if(effDist()<=0)return;
  var t=performance.now();
  selIds().forEach(function(id){var s=setFor(id);if(s.saved)return;var i=nextIdle(s);if(i>-1)beginRep(id,i,t);});
  after();
}
function finishRep(r,now){r.final=now;r.status='done';}
function lapRep(id,i){
  var s=S.sets[id],r=s&&s.reps[i]; if(!r||r.status!=='running') return;
  var now=performance.now()-r.t0; r.laps.push(now);
  if(r.laps.length>=s.cfg.laps) finishRep(r,now);
  after();
}
function stopRep(id,i){
  var s=S.sets[id],r=s&&s.reps[i]; if(!r||r.status!=='running') return;
  var now=performance.now()-r.t0; r.laps.push(now); finishRep(r,now); after();
}
function stopAll(){
  Object.keys(S.sets).forEach(function(id){
    var s=S.sets[id],i=runningRep(s);
    if(i>-1){var r=s.reps[i],now=performance.now()-r.t0;r.laps.push(now);finishRep(r,now);}
  });
  after();
}
function undoRep(id,i){
  var s=S.sets[id],r=s&&s.reps[i]; if(!r||s.saved||!r.laps.length) return;
  if(r.status==='done'&&runningRep(s)>-1){toast('Erst die laufende Wiederholung beenden');return;}
  r.laps.pop();
  if(r.status==='done'){r.status='running';r.final=null;}
  after();
}
function clearRep(id,i){
  var s=S.sets[id]; if(!s||s.saved) return;
  var tg0=s.reps[i].target;s.reps[i]=newRep();s.reps[i].target=tg0;
  if(s.reps.every(function(r){return r.status==='idle';})){s.started=false;s.cfg=null;}
  after();
}
function setRepTarget(id,i,v){var s=S.sets[id];if(!s||!s.reps[i]||s.saved)return;s.reps[i].target=v;render();}
function setAllTargets(id,v){var s=S.sets[id];if(!s||s.saved)return;s.reps.forEach(function(r){r.target=v;});render();}
function setPulse(id,i,v){
  var s=S.sets[id],r=s&&s.reps[i]; if(!r) return;
  var n=parseFloat(String(v).replace(',','.'));
  r.pulse=(isFinite(n)&&n>0)?Math.min(60,Math.round(n)):null;
  render();
}
function newRun(ids){ids.forEach(function(id){delete S.sets[id];});after();}

/* ---------- Pool ---------- */
function addPool(o){
  var p=normPool(Object.assign({id:pid()},o));
  S.pool.push(p);S.sel.push(p.id);persistPool();persistSel();
}
function removePool(id){
  S.pool=S.pool.filter(function(p){return p.id!==id;});
  S.sel=S.sel.filter(function(i){return i!==id;});
  delete S.sets[id];persistPool();persistSel();render();
}
function toggleSel(id){
  var i=S.sel.indexOf(id);
  if(i>-1){S.sel.splice(i,1);var s=S.sets[id];if(s&&(!s.started||s.saved))delete S.sets[id];}
  else S.sel.push(id);
  persistSel();render();
}

/* ---------- Auswertung ---------- */
function evalReps(reps,hrmax,target,zb){
  zb=zbOk(zb)?zb:S.zb;
  var rows=reps.map(function(r,k){

function chartPulse(ev){
  var rows=ev.rows,n=rows.length,slot=56,W=Math.max(300,n*slot+88),H=204,top=14,bot=48,L=36,R=44;
  var hf=ev.hrmax,lo=Math.max(40,Math.floor(hf*0.5/10)*10),hi=Math.ceil(hf*1.03/10)*10;
  function y(v){v=Math.max(lo,Math.min(hi,v));return top+(hi-v)/(hi-lo)*(H-top-bot);}
  var bounds=[lo].concat(ev.zb.map(function(b){return b/100*hf;})).concat([hi]);
  var svg=sv('svg',{viewBox:'0 0 '+W+' '+H,class:'chart','aria-label':'Puls je Wiederholung in den Belastungszonen',style:'width:100%;min-width:'+W+'px'});
  svg.setAttribute('role','img');
  var cw=(W-L-R)/n;
  for(var zi=0;zi<5;zi++){
    var a=bounds[zi],b=bounds[zi+1];
    if(b<=lo||a>=hi) continue;
    var y1=y(b),y2=y(a);
    svg.append(sv('rect',{x:L,y:y1,width:W-L-R,height:y2-y1,fill:'var(--z'+zi+')','fill-opacity':0.2}));
    if(y2-y1>=12) svg.append(sv('text',{x:W-R+6,y:(y1+y2)/2+3.5,'font-size':10,fill:'var(--muted)',text:ZN[zi]}));
  }
  rows.forEach(function(r,k){
    if(r.target==null) return;
    var y1=y(bounds[r.target+1]),y2=y(bounds[r.target]),cx=L+cw*(k+0.5);
    svg.append(sv('rect',{x:cx-cw/2+3,y:y1+1,width:cw-6,height:Math.max(2,y2-y1-2),rx:3,fill:'var(--z'+r.target+')','fill-opacity':0.4,stroke:'var(--ink)','stroke-width':1.5,'stroke-dasharray':'5 3'}));
  });
  ev.zb.forEach(function(bv){var v=bv/100*hf;if(v>lo&&v<hi)svg.append(sv('text',{x:L-4,y:y(v)+3.5,'text-anchor':'end','font-size':9,fill:'var(--muted)',text:Math.round(v)}));});
  svg.append(sv('text',{x:L-4,y:y(hi)+9,'text-anchor':'end','font-size':9,fill:'var(--muted)',text:hi}));
  var pts=[];
  rows.forEach(function(r,k){if(r.bpm!=null)pts.push({x:L+cw*(k+0.5),y:y(r.bpm),r:r});});
  if(pts.length>1) svg.append(sv('polyline',{points:pts.map(function(q){return q.x+','+q.y;}).join(' '),fill:'none',stroke:'var(--ink)','stroke-width':1.5}));
  pts.forEach(function(q){
    svg.append(sv('circle',{cx:q.x,cy:q.y,r:5.5,fill:q.r.zi!=null?'var(--z'+q.r.zi+')':'var(--accent)',stroke:'var(--surface)','stroke-width':2}));
    svg.append(sv('text',{x:q.x,y:q.y-10,'text-anchor':'middle','font-size':10,'font-weight':600,fill:'var(--ink)',stroke:'var(--surface)','stroke-width':3,'paint-order':'stroke',text:q.r.bpm}));
  });
  rows.forEach(function(r,k){
    var cx=L+cw*(k+0.5);
    svg.append(sv('text',{x:cx,y:H-bot+16,'text-anchor':'middle','font-size':10,fill:'var(--muted)',text:'Wdh. '+r.i}));
    if(r.target!=null){
      var t=r.rel==='ok'?'✓ im Ziel':(r.rel==='low'?'▼ zu leicht':(r.rel==='high'?'▲ zu hoch':'–'));
      svg.append(sv('text',{x:cx,y:H-bot+32,'text-anchor':'middle','font-size':10,'font-weight':600,fill:r.rel==='ok'?'var(--ok)':(r.rel?'var(--warn)':'var(--muted)'),text:t}));
    }
  });
  return svg;
}

function ranked(arr){
  var t=arr.filter(function(a){return a.time!=null;}).sort(function(a,b){return a.time-b.time;});
  var out=[],prev=null,pr=0;
  t.forEach(function(a,i){var r=(prev!==null&&a.time===prev)?pr:i+1;prev=a.time;pr=r;out.push(Object.assign({},a,{rank:r}));});
  arr.filter(function(a){return a.time==null;}).forEach(function(a){out.push(Object.assign({},a,{rank:null}));});
  return out;
}
function typeLabel(t){return t==='wk'?'Wettkampf':'Training';}
function gTitle(g){return titleOf(g.discLabel,g.repsN||1,g.distance);}
function groupFromSets(ids,meta){
  var map={},order=[];
  ids.forEach(function(id){
    var s=S.sets[id]; if(!s||!s.started) return;
    var c=s.cfg,reps=[];
    s.reps.forEach(function(r,i){if(r.status==='done')reps.push({n:i+1,time:r.final,splits:r.laps.slice(),pulse:r.pulse,target:r.target!=null?r.target:null});});
    if(!reps.length) return;
    var key=[c.disc,c.distance,c.pool,c.split||c.pool,c.reps].join('|');
    if(!map[key]){map[key]={date:meta.date,type:meta.type,title:meta.title,note:meta.note,pool:c.pool,split:c.split||c.pool,family:c.family,disc:c.disc,discLabel:c.discLabel,distance:c.distance,repsN:c.reps,target:null,athletes:[]};order.push(key);}
    map[key].athletes.push({name:poolName(id),reps:reps,hrmax:poolHf(id),target:null,zb:S.zb.slice(),time:avgT(reps)});
  });
  return order.map(function(k){return map[k];});
}
function groupResults(list){
  var map={},order=[];
  list.forEach(function(r){
    var key=[r.date,r.type,r.title,r.disc,r.distance,r.repsN||1,r.pool,r.split||r.pool].join('|');
    if(!map[key]){map[key]={date:r.date,type:r.type,title:r.title||'',note:'',pool:r.pool,split:r.split||r.pool,family:r.family,disc:r.disc,discLabel:r.discLabel,distance:r.distance,repsN:r.repsN||1,target:null,athletes:[],newest:0};order.push(key);}
    var g=map[key];
    g.athletes.push({rid:r.id,athleteId:r.athleteId||null,name:r.name,reps:r.reps,hrmax:r.hrmax||null,target:null,zb:r.zb,time:avgT(r.reps)});
    if(!g.note&&r.note) g.note=r.note;
    g.newest=Math.max(g.newest,r.createdAt||0);
  });
  return order.map(function(k){return map[k];}).sort(function(a,b){return (b.date||'').localeCompare(a.date||'')||b.newest-a.newest;});
}
function pulseLine(o){
  if(o.bpm==null) return null;
  var s='Puls '+o.bpm+'/min';
  if(o.zi!=null) s+=' ('+ZN[o.zi]+')';
  if(o.target!=null) s+=' · Ziel '+ZN[o.target]+(o.rel==='ok'?': ✓ erreicht':(o.rel==='low'?': zu leicht':(o.rel==='high'?': zu hoch':'')));
  return s;
}
function buildText(groups,detail){
  var g0=groups[0];
  var L=['*Tauchsportclub Marzahn*',[typeLabel(g0.type),g0.title].filter(Boolean).join(' · '),'Datum: '+dateShort(g0.date)];
  var note='';
  groups.forEach(function(g){
    var spl=g.split||g.pool,bahnen=Math.max(1,Math.ceil(g.distance/spl));
    L.push('');L.push('━━━━━━━━━━━━');
    L.push('*'+gTitle(g)+'*');
    L.push(g.pool+'-m-Bahn'+(spl!==g.pool?' · Zeiten alle '+spl+' m · '+bahnen+' Abschnitte':' · '+bahnen+' Bahnen')+(g.repsN>1?' je Wiederholung':''));
    ranked(g.athletes).forEach(function(a){
      var ev=evalReps(a.reps,a.hrmax,a.target,a.zb),multi=a.reps.length>1;
      L.push('');
      L.push((a.rank?a.rank+'. ':'– ')+'*'+a.name+'*');
      if(!a.reps.length){L.push('keine Zeit');return;}
      L.push(multi?'Ø '+fmt(a.time)+' · Beste '+fmt(bestT(a.reps)):'Endzeit: '+fmt(a.reps[0].time));
      ev.rows.forEach(function(o){
        if(multi) L.push('Wdh. '+o.i+': '+fmt(o.time));
        if(detail&&o.splits.length>1) o.splits.forEach(function(c,i){L.push((multi?'  ':'')+splitLabel(g,i)+': '+fmt(c)+' (+'+fmtLap(c-(i?o.splits[i-1]:0))+')');});
        var pl=pulseLine(o); if(pl) L.push((multi?'  ':'')+pl);
      });
      if(ev.verdict) L.push('Ziel-Zonen: '+verdictWord(ev.verdict)+' ('+ev.okN+' von '+ev.checked+' Wdh.)');
      else if(ev.avgBpm!=null&&multi) L.push('Ø Puls '+ev.avgBpm+'/min'+(ev.avgZi!=null?' ('+ZN[ev.avgZi]+')':''));
    });
    if(!note&&g.note) note=g.note;
  });
  if(note){L.push('');L.push(note);}
  return L.join('\n');
}
function csvOf(groups){
  var q=function(v){return '"'+String(v==null?'':v).replace(/"/g,'""')+'"';};
  var rows=[['Datum','Art','Titel','Disziplin','Strecke (m)','Wiederholung','Bahnlänge (m)','Messabstand (m)','Rang','Name','Zeit','Puls/10 s','Puls/min','Zone','Ziel','Bewertung','Bahnzeiten'].map(q).join(';')];
  groups.forEach(function(g){
    ranked(g.athletes).forEach(function(a){
      var ev=evalReps(a.reps,a.hrmax,a.target,a.zb);
      ev.rows.forEach(function(o){
        rows.push([dateShort(g.date),typeLabel(g.type),g.title,g.discLabel,g.distance,o.i,g.pool,g.split||g.pool,a.rank||'',a.name,fmt(o.time),o.pulse==null?'':o.pulse,o.bpm==null?'':o.bpm,o.zi==null?'':ZN[o.zi],o.target!=null?ZN[o.target]:'',o.rel?relText(o.rel):'',
          o.splits.map(function(c,i){return fmtLap(c-(i?o.splits[i-1]:0));}).join(' | ')].map(q).join(';'));
      });
    });
  });
  return '﻿'+rows.join('\r\n');
}

function saveSets(ids,meta){
  var n=0;
  ids.forEach(function(id){
    var s=S.sets[id]; if(!s||!s.started||s.saved||runningRep(s)>-1) return;
    var reps=[];
    s.reps.forEach(function(r,i){if(r.status==='done')reps.push({n:i+1,time:r.final,splits:r.laps.slice(),pulse:r.pulse,target:r.target!=null?r.target:null});});
    if(!reps.length) return;
    var c=s.cfg;
    var res={kind:'result',id:rid(),v:3,date:meta.date,type:meta.type,title:meta.title,note:meta.note,pool:c.pool,split:c.split||c.pool,family:c.family,disc:c.disc,discLabel:c.discLabel,

function editPulse(rid_,k,v){

    (function(i){
      rows.push(h('div',{class:'zrow'},h('i',{style:'--zc:var(--z'+i+')'}),
        h('div',{},h('div',{class:'zn',text:'Zone '+(i+1)+' · '+ZN[i]}),h('div',{class:'muted small',text:ZLONG[i]+' · '+zoneRange(i,S.zb)})),
        h('div',{class:'unit'},h('input',{type:'number',inputmode:'decimal',min:'1',max:'100','aria-label':ZN[i]+' beginnt bei Prozent des Maximalpulses',value:String(S.zb[i-1]),onchange:function(e){
          var v=parseFloat(String(e.target.value).replace(',','.')),cp=S.zb.slice();cp[i-1]=v;
          if(!zbOk(cp)){toast('Die Werte müssen von GA1 bis SB aufsteigen.');render();return;}
          S.zb=cp;persistZb();render();}}),h('span',{class:'muted',text:'%'}))));
    })(i);
  }
  rows[0].querySelector('.zn').textContent='Zone 1 · '+ZN[0];
  return h('section',{class:'panel'},h('h2',{text:'Belastungszonen'}),
    h('p',{class:'muted small',text:'5-Zonen-Modell. Jede Zone beginnt bei diesem Anteil des Maximalpulses (HFmax). SB reicht bis 100 %. Die Werte sind übliche Richtwerte. Passe sie an das Training deines Vereins an.'}),
    h('div',{class:'stack',style:'gap:10px'},rows),
    h('button',{type:'button',class:'btn ghost mid',text:'Standardwerte',onclick:function(){S.zb=ZB_DEF.slice();persistZb();render();}}));
}
function poolCard(p){
  var id=p.id,hf=hfmaxOf(p),how=hfHow(p);
  function fld(key,label,min,max,ph,dec){
    var iid='pc-'+id+'-'+key;
    return h('div',{},h('label',{class:'lbl',for:iid,text:label}),
      h('input',{type:'number',id:iid,inputmode:dec?'decimal':'numeric',min:String(min),max:String(max),step:dec?'0.1':'1',placeholder:ph||'',value:p[key]!=null?String(p[key]):'',
        onchange:function(e){var n=parseFloat(String(e.target.value).replace(',','.'));p[key]=(n>=min&&n<=max)?(dec?Math.round(n*10)/10:Math.round(n)):null;persistPool();render();}}));
  }
  var calc=(!p.hfmax&&calcOk(p))?String((p.sex==='w'?226:220)-ageOf(p)):'';
  return h('div',{class:'pcard ac',style:'--ac:'+acol(p.id)},
    h('div',{class:'poolrow'},
      h('input',{type:'text',value:p.name,maxlength:'40','aria-label':'Name',autocomplete:'off',oninput:function(e){p.name=e.target.value;persistPool();}}),
      iconArmed((p.name||'Sportler')+' aus dem Pool löschen',function(){removePool(p.id);},isLocked(p.id))),
    h('div',{},h('span',{class:'lbl',text:'Geschlecht'}),seg([{v:'m',l:'Männlich'},{v:'w',l:'Weiblich'}],p.sex,function(v){p.sex=v;persistPool();render();},'Geschlecht von '+(p.name||'Sportler'))),
    h('div',{class:'pgrid'},fld('birth','Geburtsjahr',1930,new Date().getFullYear(),'z. B. 2010'),fld('height','Größe in cm',50,250,'z. B. 165',true),
      fld('weight','Gewicht in kg',10,250,'z. B. 55',true),fld('hfmax','HFmax gemessen',100,260,calc?'berechnet '+calc:'optional')),
    h('p',{class:'pnote '+(hf?'':'muted'),text:hf?'Maximalpuls für die Zonen: '+hf+' pro Minute ('+how+')':'Trage Geschlecht und Geburtsjahr ein, dann berechnet die App den Maximalpuls. Oder trage einen gemessenen HFmax ein.'}));
}
function viewSet(){
  var cards=S.pool.map(poolCard);
  var newI=h('input',{type:'text',id:'new-ath',maxlength:'40',autocomplete:'off',placeholder:'Vor- und Nachname'});
  var nsex=null;
  var nsegs=seg([{v:'m',l:'Männlich'},{v:'w',l:'Weiblich'}],null,function(v){nsex=v;},'Geschlecht des neuen Sportlers');
  function nf(idn,label,ph,min,max){return {i:h('input',{type:'number',id:idn,inputmode:'decimal',min:String(min),max:String(max),placeholder:ph}),l:label,id:idn};}
  var fb=nf('new-birth','Geburtsjahr','z. B. 2010',1930,new Date().getFullYear()),fh=nf('new-height','Größe in cm','z. B. 165',50,250),fw=nf('new-weight','Gewicht in kg','z. B. 55',10,250),fx=nf('new-hf','HFmax gemessen','optional',100,260);
  function num(f){var n=parseFloat(String(f.i.value).replace(',','.'));return isFinite(n)?n:null;}
  var form=h('form',{class:'pcard',onsubmit:function(e){
    e.preventDefault();var v=newI.value.trim();if(!v)return;
    addPool({name:v,sex:nsex,birth:num(fb),height:num(fh),weight:num(fw),hfmax:num(fx)});
    render();requestAnimationFrame(function(){var i=$('#new-ath');if(i)i.focus();});
  }},
    h('div',{},h('label',{class:'lbl',for:'new-ath',text:'Neuer Sportler'}),newI),
    h('div',{},h('span',{class:'lbl',text:'Geschlecht'}),nsegs),
    h('div',{class:'pgrid'},[fb,fh,fw,fx].map(function(f){return h('div',{},h('label',{class:'lbl',for:f.id,text:f.l}),f.i);})),
    h('button',{type:'submit',class:'btn primary',text:'Sportler hinzufügen'}));
  var pool=h('section',{class:'panel'},h('h2',{text:'Sportler-Pool'}),
    h('p',{class:'muted small',text:'Alle Sportler des Vereins. Beim Stoppen wählst du daraus aus. Der Maximalpuls (HFmax) wird aus Geschlecht und Alter berechnet: Männer 220 minus Alter, Frauen 226 minus Alter. Die Formel nutzt das Geburtsjahr, deshalb ist es ein Pflichtfeld für die Berechnung. Größe und Gewicht werden mitgespeichert, beeinflussen den HFmax aber nicht. Einen gemessenen HFmax trägst du direkt ein, er hat Vorrang. Gespeicherte Ergebnisse behalten den HFmax von damals.'}),
    cards.length?h('div',{class:'stack',style:'gap:10px'},cards):h('p',{class:'muted',text:'Noch niemand im Pool.'}),
    form);
  var hand=h('section',{class:'panel'},h('h2',{text:'Bedienung'}),
    h('p',{class:'muted small',text:'Auf welcher Seite sollen die Knöpfe der Stoppuhren stehen? Rechtshänder wählen rechts, Linkshänder links.'}),
    seg([{v:'l',l:'Links'},{v:'r',l:'Rechts'}],S.hand,function(v){S.hand=v;lsSet('bz.hand',v);applyHand();},'Seite der Knöpfe'));
  var file=h('input',{type:'file',accept:'image/*',id:'logo-file',hidden:true,onchange:function(e){
    var f=e.target.files&&e.target.files[0]; if(!f) return;
    shrink(f).then(function(u){
      S.logo=u;lsSet('bz.logo',u);cset('logo',{src:u});applyLogo();render();toast('Logo gespeichert');
    }).catch(function(){toast('Das Bild konnte nicht gelesen werden');});
  }});
  var prev=h('div',{class:'logoprev'});
  prev.style.backgroundImage='url("'+curLogo()+'")';
  var store=S.storage==='cloud'
    ?'Pool, Ergebnisse und Logo werden in deinem Konto gesichert und sind auf deinen Geräten verfügbar.'
    :'Pool, Ergebnisse und Logo liegen nur auf diesem Gerät. Sichere wichtige Ergebnisse über Teilen oder CSV.';
  return h('div',{class:'stack'},pool,zonePanel(),hand,
    h('section',{class:'panel'},h('h2',{text:'Vereinslogo'}),
      h('p',{class:'muted',text:'Das Logo des Tauchsportclubs Marzahn steht neben dem Titel und blass im Hintergrund. Du kannst ein anderes Bild wählen.'}),
      prev,file,
      h('div',{class:'acts'},
        h('button',{type:'button',class:'btn primary',text:'Anderes Logo wählen',onclick:function(){file.click();}}),
        S.logo?h('button',{type:'button',class:'btn ghost',text:'Standard-Logo',onclick:function(){S.logo=null;lsDel('bz.logo');cdel('logo');applyLogo();render();}}):null)),
    h('section',{class:'panel'},h('h2',{text:'Speicherort'}),h('p',{text:store})));
}

/* ---------- Rendern ---------- */
function render(){
  document.querySelectorAll('.tabs button').forEach(function(b){b.setAttribute('aria-selected',String(b.dataset.tab===S.tab));});
  $('#view').replaceChildren(S.tab==='stop'?viewStop():S.tab==='res'?viewRes():viewSet());
  renderBar();tickOnce();
}
document.querySelectorAll('.tabs button').forEach(function(b){
  b.addEventListener('click',function(){S.tab=b.dataset.tab;render();window.scrollTo(0,0);});
});
$('#scrim').addEventListener('click',closeSheet);
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&sheetOpen)closeSheet();});
applyHand();applyLogo();render();initCloud();
})();
</script>
<script>
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}
</script>
